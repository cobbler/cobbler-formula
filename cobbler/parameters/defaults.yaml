# -*- coding: utf-8 -*-
# vim: ft=yaml
#
# Set default values.
---
values:
  version: 3.3.7
  pkg:
    source:
      enabled: false
      version: "main"
    communityrepo:
      # This is mutually exclusive with "epel"!
      enabled: false
      # Available: "2.4.x", "2.6.x", "2.8.x", "3.0.x", "3.1.x", "3.2.x",
      # "3.3.x", "4.0.x"
      version: "3.3.x"
    epel:
      # This is mutually exclusive with "communityrepo"!
      enabled: false
    name: cobbler
    # Installs "<pkg.name>-<webserver>" alongside "<pkg.name>" (e.g. "cobbler-apache2"),
    # pulling in a real web server package so directories cobblerd expects to exist
    # (e.g. "webdir") actually get created. Set to "nginx" to install "cobbler-nginx"
    # instead, or to false/"" to skip installing a web server sub-package entirely.
    # Only takes effect for Cobbler 4.0.0 or later; earlier versions don't split the
    # web server integration into its own sub-package.
    webserver: "apache2"
  service:
    name: cobblerd
  rootgroup: root
  auto_migrate_settings: false
  server: "127.0.0.1"
  menu:
    enabled: true
  default_kernel_options: {}
  authentication:
    module: "configfile"
    # This password is for the default login to newly
    # setup machines, not Cobbler itself.
    password: "$1$mF86/UHC$WvcIcX2t6crBz2onWxyac."
  authorization:
    module: "allowall"
    default_ownership:
      - "admin"
  bootloaders:
    syslinux:
      location: "/usr/share/syslinux"
      memdisk_location: "/usr/share/syslinux"
      pxelinux_location: "/usr/share/syslinux"
    grub2:
      mod_location: "/usr/share/grub2"
    shim:
      location: "/usr/share/efi/*/"
      # This is YAML as such we need a double backslash to get a single one.
      file: "shim\\.efi"
    ipxe:
      enabled: false
      location: /usr/share/ipxe/
  dhcp:
    v4: false
    v6: false
    module: "isc"
  dns:
    enabled: false
    module: "bind"
    bind:
      location: /var/lib/named
      master: "127.0.0.1"
      forward_zones: []
      reverse_zones: []
  tftp:
    enabled: true
    module: "in_tftpd"
    location: "/srv/tftpboot"
  nextserver:
    v4: "127.0.0.1"
    v6: "::1"
  rsync:
    enabled: false
  power_management:
    default_type: "ipmilanplus"
  scm_track:
    enabled: false
    mode: "git"
    author: "cobbler <cobbler@localhost>"
    push_script: "/bin/true"
  config: /etc/cobbler/settings.yaml
  webdir: /var/www
